name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Test, Build (Cached) & Publish Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false

      - name: Cache Go build cache (GOCACHE)
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-gobuild-${{ hashFiles('daemon/**/*.go', 'go.mod') }}
          restore-keys: |
            ${{ runner.os }}-gobuild-

      - name: Run unit & race tests
        run: go test -v -race ./daemon/...

      - name: Cross-compile & package all platforms
        env:
          CGO_ENABLED: '0'
        run: |
          set -e
          mkdir -p dist

          package_target() {
            local goos="$1"
            local goarch="$2"
            local suffix="$3"
            local bin="$4"
            local ldflags="-s -w"
            if [ "$goos" = "windows" ]; then
              ldflags="-s -w -H=windowsgui"
            fi

            rm -rf stage && mkdir -p stage
            GOOS="$goos" GOARCH="$goarch" go build -ldflags="$ldflags" -o "stage/$bin" ./daemon
            cp -r extension stage/extension
            cp -r scripts stage/scripts
            cp README.md stage/

            (
              cd stage
              if [ "$goos" = "windows" ]; then
                zip -rq "../dist/graball-${suffix}.zip" .
              else
                tar czf "../dist/graball-${suffix}.tar.gz" .
              fi
            )
          }

          package_target linux   amd64 linux-amd64   graball
          package_target linux   arm64 linux-arm64   graball
          package_target windows amd64 windows-amd64 graball.exe
          package_target darwin  amd64 darwin-amd64  graball
          package_target darwin  arm64 darwin-arm64  graball

          (cd extension && zip -rq ../dist/graball-extension.zip .)
          ls -lh dist/

      - name: Publish GitHub Release (with retry)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          for attempt in 1 2 3 4; do
            echo "[*] Publishing release $TAG (attempt $attempt)..."
            if gh release view "$TAG" >/dev/null 2>&1; then
              if gh release upload "$TAG" dist/* --clobber && gh release edit "$TAG" --draft=false --latest; then
                echo "[+] Uploaded all assets and published release $TAG!"
                exit 0
              fi
            else
              if gh release create "$TAG" dist/* --title "GrabAll $TAG" --generate-notes; then
                echo "[+] Created release $TAG with all assets!"
                exit 0
              fi
            fi
            echo "[!] Transient GitHub API error on attempt $attempt, retrying in $((attempt * 5))s..."
            sleep $((attempt * 5))
          done
          echo "[-] Failed to publish release after 4 attempts"
          exit 1
