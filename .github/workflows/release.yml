name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    name: Test before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: go test -v -race ./daemon/...

  build-and-package:
    name: Build (${{ matrix.suffix }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
            binary: graball
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
            binary: graball
          - goos: windows
            goarch: amd64
            suffix: windows-amd64
            binary: graball.exe
          - goos: darwin
            goarch: amd64
            suffix: darwin-amd64
            binary: graball
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64
            binary: graball

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          LDFLAGS="-s -w"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            LDFLAGS="-s -w -H=windowsgui"
          fi
          go build -ldflags="$LDFLAGS" -o ${{ matrix.binary }} ./daemon

      - name: Package archive
        run: |
          mkdir -p release dist
          cp ${{ matrix.binary }} release/
          cp -r extension release/extension
          cp -r scripts release/scripts
          cp README.md release/
          cd release
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip -r ../dist/graball-${{ matrix.suffix }}.zip .
          else
            tar czf ../dist/graball-${{ matrix.suffix }}.tar.gz .
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.suffix }}
          path: dist/graball-${{ matrix.suffix }}.*

  package-extension:
    name: Package Extension
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zip extension
        run: |
          mkdir -p dist
          cd extension
          zip -r ../dist/graball-extension.zip .

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-extension
          path: dist/graball-extension.zip

  publish-release:
    name: Publish GitHub Release
    needs: [build-and-package, package-extension]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all release assets
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List assets
        run: ls -lh dist/

      - name: Create or update GitHub Release (with retry)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          for attempt in 1 2 3 4; do
            echo "[*] Publishing release $TAG (attempt $attempt)..."
            if gh release view "$TAG" >/dev/null 2>&1; then
              if gh release upload "$TAG" dist/* --clobber; then
                echo "[+] Uploaded all assets to existing release $TAG!"
                exit 0
              fi
            else
              if gh release create "$TAG" dist/* --title "GrabAll $TAG" --generate-notes; then
                echo "[+] Created release $TAG with all assets!"
                exit 0
              fi
            fi
            echo "[!] Transient GitHub API error on attempt $attempt, retrying in $((attempt * 5))s..."
            sleep $((attempt * 5))
          done
          echo "[-] Failed to publish release after 4 attempts"
          exit 1
