name: CI — Test & Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Run tests
        run: go test -v ./daemon/...

  build:
    name: Build (${{ matrix.goos }}-${{ matrix.goarch }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            binary: graball
          - goos: linux
            goarch: arm64
            binary: graball
          - goos: windows
            goarch: amd64
            binary: graball.exe
          - goos: darwin
            goarch: amd64
            binary: graball
          - goos: darwin
            goarch: arm64
            binary: graball

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          go build -ldflags="-s -w" -o ${{ matrix.binary }} ./daemon
          ls -lh ${{ matrix.binary }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: graball-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ matrix.binary }}

  package-extension:
    name: Package Extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zip extension
        run: |
          cd extension
          zip -r ../graball-extension.zip .
          cd ..
          ls -lh graball-extension.zip

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: graball-extension
          path: graball-extension.zip
