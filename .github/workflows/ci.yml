name: CI — Test & Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Test, Cross-Compile & Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false

      - name: Cache Go build cache (GOCACHE)
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-gobuild-${{ hashFiles('daemon/**/*.go', 'go.mod') }}
          restore-keys: |
            ${{ runner.os }}-gobuild-

      - name: Run unit & race tests
        run: go test -v -race ./daemon/...

      - name: Cross-compile all platforms (cached)
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          GOOS=linux   GOARCH=amd64 go build -ldflags="-s -w" -o dist/graball-linux-amd64 ./daemon
          GOOS=linux   GOARCH=arm64 go build -ldflags="-s -w" -o dist/graball-linux-arm64 ./daemon
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w -H=windowsgui" -o dist/graball.exe ./daemon
          GOOS=darwin  GOARCH=amd64 go build -ldflags="-s -w" -o dist/graball-darwin-amd64 ./daemon
          GOOS=darwin  GOARCH=arm64 go build -ldflags="-s -w" -o dist/graball-darwin-arm64 ./daemon
          cd extension && zip -rq ../dist/graball-extension.zip . && cd ..
          ls -lh dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: graball-ci-bundles
          path: dist/*
