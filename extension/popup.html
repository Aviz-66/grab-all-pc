<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GrabAll</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #10b981;
      --danger: #ef4444;
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      width: 360px;
      background: var(--bg);
      color: var(--text);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo {
      font-size: 20px;
    }

    .brand h2 {
      font-size: 16px;
      font-weight: 700;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .dot.online { background-color: var(--success); box-shadow: 0 0 6px var(--success); }
    .dot.offline { background-color: var(--danger); box-shadow: 0 0 6px var(--danger); }

    .btn {
      width: 100%;
      padding: 8px 12px;
      border-radius: var(--radius);
      border: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }
    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-secondary {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover {
      background: #27354f;
    }

    .btn-sm {
      padding: 4px 8px;
      font-size: 11px;
      width: auto;
    }

    .section-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 4px;
    }

    .media-list {
      max-height: 160px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .media-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .media-info {
      flex: 1;
      min-width: 0;
    }

    .media-type {
      font-size: 10px;
      font-weight: 700;
      background: rgba(59, 130, 246, 0.2);
      color: #60a5fa;
      padding: 1px 4px;
      border-radius: 3px;
      display: inline-block;
      margin-bottom: 2px;
    }

    .media-url {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .empty-sniff {
      font-size: 12px;
      color: var(--muted);
      text-align: center;
      padding: 12px;
      background: var(--card);
      border-radius: 6px;
      border: 1px dashed var(--border);
    }

    .toggles-group {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
    }

    .token-input-group {
      display: flex;
      gap: 6px;
    }

    .token-input-group input {
      flex: 1;
      background: #0b0f19;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 12px;
      outline: none;
    }

    .footer {
      display: flex;
      gap: 8px;
      padding-top: 6px;
      border-top: 1px solid var(--border);
    }

    .alert {
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 11px;
      display: none;
    }
    .alert-success { background: rgba(16, 185, 129, 0.2); color: #34d399; }
    .alert-danger { background: rgba(239, 68, 68, 0.2); color: #f87171; }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <span class="logo">⚡</span>
      <h2>GrabAll</h2>
    </div>
    <div class="status-indicator">
      <span id="daemon-dot" class="dot offline"></span>
      <span id="daemon-status-text">Connecting...</span>
    </div>
  </div>

  <div id="status-alert" class="alert"></div>

  <!-- Primary Page Action -->
  <div style="display:flex; gap:6px;">
    <select id="select-quality" style="flex:1; background:var(--card); border:1px solid var(--border); color:var(--text); padding:6px 8px; border-radius:6px; font-size:12px; outline:none;">
      <optgroup label="Video">
        <option value="best" selected>🎬 Best Quality</option>
        <option value="2160">📺 4K (2160p)</option>
        <option value="1080">📺 1080p</option>
        <option value="720">📺 720p</option>
        <option value="480">📺 480p</option>
        <option value="360">📺 360p</option>
      </optgroup>
      <optgroup label="Audio Only">
        <option value="audio-mp3">🎵 Audio Only (MP3)</option>
        <option value="audio-m4a">🎵 Audio Only (M4A)</option>
        <option value="audio-opus">🎵 Audio Only (Opus)</option>
        <option value="audio-best">🎵 Best Audio</option>
      </optgroup>
    </select>
  </div>

  <div class="toggle-row" style="font-size:12px; padding:2px 2px;">
    <label for="check-playlist" style="cursor:pointer;">📑 Download Playlist (if playlist URL)</label>
    <input type="checkbox" id="check-playlist">
  </div>

  <div id="playlist-range-row" style="display:none; gap:8px; align-items:center; font-size:11px; color:var(--muted); background:var(--card); border:1px solid var(--border); border-radius:6px; padding:6px 8px;">
    <span>Start #:</span>
    <input type="number" id="input-pl-start" min="1" value="1" style="width:52px; background:#0b0f19; border:1px solid var(--border); color:var(--text); padding:3px 6px; border-radius:4px; font-size:12px;">
    <span style="margin-left:auto;">Max Videos (0=All):</span>
    <input type="number" id="input-pl-count" min="0" value="10" style="width:58px; background:#0b0f19; border:1px solid var(--border); color:var(--text); padding:3px 6px; border-radius:4px; font-size:12px;">
  </div>

  <button id="btn-download-page" class="btn btn-primary">
    🎬 Download Current Page Video
  </button>

  <!-- Detected Media -->
  <div class="section-title">Detected Media on Tab</div>
  <div id="media-container" class="media-list">
    <div class="empty-sniff">No video streams detected yet.</div>
  </div>

  <!-- Toggles & Token -->
  <div class="toggles-group">
    <div class="toggle-row">
      <label for="check-intercept">Intercept Browser Downloads</label>
      <input type="checkbox" id="check-intercept">
    </div>

    <div style="font-size: 11px; color: var(--muted); margin-top: 4px;">Auth Token</div>
    <div class="token-input-group">
      <input type="password" id="input-token" placeholder="Paste Daemon Auth Token">
      <button id="btn-save-token" class="btn btn-sm btn-secondary">Save</button>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <button id="btn-open-dashboard" class="btn btn-secondary">
      ⚡ Open GrabAll Window
    </button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
