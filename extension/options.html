<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GrabAll Settings</title>
  <style>
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
      max-width: 480px;
      margin: 0 auto;
    }
    h2 { margin-bottom: 16px; font-size: 18px; }
    .form-group { margin-bottom: 16px; display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 13px; font-weight: 600; color: #cbd5e1; }
    input[type="text"], input[type="password"] {
      background: #1e293b;
      border: 1px solid #334155;
      color: #fff;
      padding: 8px 12px;
      border-radius: 6px;
      outline: none;
    }
    .checkbox-group { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
    button {
      background: #3b82f6;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover { background: #2563eb; }
    .status { margin-top: 10px; font-size: 13px; color: #10b981; display: none; }
  </style>
</head>
<body>
  <h2>GrabAll Extension Settings</h2>
  <div class="form-group">
    <label for="opt-daemon-url">Daemon Server URL</label>
    <input type="text" id="opt-daemon-url" value="http://127.0.0.1:17890">
  </div>
  <div class="form-group">
    <label for="opt-token">Daemon Auth Token</label>
    <input type="password" id="opt-token" placeholder="Paste Auth Token from Web UI Settings">
  </div>
  <div class="checkbox-group">
    <input type="checkbox" id="opt-intercept">
    <label for="opt-intercept">Automatically intercept browser downloads</label>
  </div>
  <button id="btn-save">Save Settings</button>
  <div id="status-msg" class="status">Settings saved!</div>

  <script src="options.js"></script>
</body>
</html>
